</style></head><body><div id="app"></div><script>
// Les Quatre Voies — Moteur expérimental V3.0, sans dépendance visuelle.
const FAMILIES=['Cendre','Voile','Ronce','Astre'];
const SYMBOL={Cendre:'◆',Voile:'◈',Ronce:'✿',Astre:'✦'};
const POWER={1:3,2:6,3:9,4:12};
const ROMAN={1:'I',2:'II',3:'III',4:'IV'};
const VARIANTS={Cendre:{1:['Étincelle','Uncommon'],2:['Braise','Uncommon'],3:['Ferveur','Rare'],4:['Contrecoup','Epic']},Voile:{1:['Éclaireur','Uncommon'],2:['Détour','Rare'],3:['Dissimulation','Epic'],4:['Silence','Legendary']},Ronce:{1:['Racine','Uncommon'],2:['Écaille','Rare'],3:['Entrave','Rare'],4:['Ténacité','Epic']},Astre:{1:['Repère','Uncommon'],2:['Prisme','Rare'],3:['Relance','Epic'],4:['Convergence','Legendary']}};
const SIGNATURES={Cendre:{name:'Brasier Originel',power:14,effect:'Flamme conquérante'},Voile:{name:'Miroir du Voile',power:12,effect:'Clairvoyance voilée'},Ronce:{name:'Couronne de Ronce',power:12,effect:'Emprise'},Astre:{name:'Convergence Astrale',power:13,effect:'Cycle astral'}};
const TECH_COST={Sondage:1,Recentrage:1,Lecture:2,Ancrage:1,Rupture:2,Dissipation:1};
const EFFECT_TEXT={
 'Étincelle':'Rang d’un Assaut gagnant de 1 point et blessant : +2 dégâts fixes.',
 'Braise':'Primaire Assaut gagnant contre Assaut sans soutien Dégâts : +2 dégâts fixes.',
 'Ferveur':'Soutien Dégâts : Primaire Cendre victorieuse et blessante → +1 Insight.',
 'Contrecoup':'Primaire Assaut perdant contre Assaut : inflige 3 dégâts fixes.',
 'Éclaireur':'À la révélation en Secondaire : observe une carte aléatoire de main adverse.',
 'Détour':'Interférence réussie non annulée : observe une carte aléatoire adverse.',
 'Dissimulation':'À la révélation : masque l’autre Secondaire active jusqu’à fin de tour.',
 'Silence':'Interférence non annulée contre Secondaire IV engagée : neutralise effet de Primaire en attente.',
 'Racine':'Soutien Rang Garde gagnante : identifie une Secondaire cachée repoussée.',
 'Écaille':'Soutien Rang Garde gagnante : soigne 2 PV après le Clash.',
 'Entrave':'Primaire Garde : envoie une Secondaire cachée repoussée sous la pioche.',
 'Ténacité':'Soutien Rang Garde perdante : retour au-dessous de sa pioche.',
 'Repère':'À la révélation : observe le sommet de sa propre pioche.',
 'Prisme':'Soutien Dégâts : +1 d’affinité même avec une autre famille.',
 'Relance':'Interférence non annulée contre rang III : retour au sommet de pioche.',
 'Convergence':'Soutien Dégâts vers autre famille : coefficient ×6.',
 'Flamme conquérante':'Assaut gagnant et blessant avec soutien Dégâts : repousse une Secondaire cachée.',
 'Clairvoyance voilée':'À révélation : voit une carte de main adverse et la plus ancienne Secondaire cachée.',
 'Emprise':'Garde gagnante : repousse une Secondaire adverse encore en jeu, cachée ou active.',
 'Cycle astral':'Victoire avec exactement un soutien Dégâts ou Interférence valide : retour du soutien en sommet de pioche.'
};
function makeDeck(family='Cendre',variants=true) {
 const cards=[];
 for(const f of FAMILIES)for(let rank=1;rank<=4;rank++){
  const [effect,rarity]=VARIANTS[f][rank];cards.push({id:`${f}-${rank}`,name:`${f} ${ROMAN[rank]}`,family:f,rank,power:POWER[rank],signature:false,effect:variants?effect:null,rarity:variants?rarity:'Basic'});
 }
 const sig=SIGNATURES[family];cards.push({id:`signature-${family}`,name:sig.name,family,rank:Infinity,power:sig.power,signature:true,effect:sig.effect,rarity:'Signature'});return cards;
}
function rngFromSeed(seed=2026) {let state=(Number(seed)>>>0)||1;return ()=>{state^=state<<13;state^=state>>>17;state^=state<<5;return (state>>>0)/4294967296;};}
function shuffle(a,rng){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function randomOf(list,rng){return list.length?list[Math.floor(rng()*list.length)]:null;}
const who=i=>i===0?'Vous':'Rival';
function log(g,msg,privateTo=null){g.log.push({turn:g.turn,msg,privateTo});if(g.log.length>450)g.log.shift();}
function cardText(c){return c?`${c.name}${c.effect?' · '+c.effect:''}`:'—';}
function makeGame(opts={}){
 const rng=rngFromSeed(opts.seed??20261015);
 const players=[0,1].map(i=>({name:i?'Rival':'Vous',hp:Math.max(1,Number(opts[i?'enemyHp':'heroHp']||90)),maxHp:Math.max(1,Number(opts[i?'enemyHp':'heroHp']||90)),insight:1,gained:0,techUsed:false,techs:i?(opts.enemyTechs||['Ancrage','Dissipation']):(opts.techs||['Lecture','Ancrage']),deck:shuffle(makeDeck(i?(opts.enemySignature||'Ronce'):(opts.heroSignature||'Cendre'),i?opts.enemyVariants!==false:opts.heroVariants!==false),rng),hand:[],discard:[],secondary:[null,null],primary:null,stance:null,pending:null,masked:new Set(),info:[]}));
 const g={turn:0,phase:'init',players,log:[],rng,seed:opts.seed??20261015,winner:null,extension:0,pendingRepels:[],lastResult:null,aiPlan:null};
 startTurn(g);return g;
}
function putIn(g,p,card,destination='discard'){
 if(destination==='top')p.deck.push(card);else if(destination==='bottom')p.deck.unshift(card);else if(destination==='hand')p.hand.push(card);else p.discard.push(card);
}
function draw(g,i,n=1){const p=g.players[i];let drawn=0;for(let j=0;j<n;j++){if(!p.deck.length){if(!p.discard.length)break;p.deck=shuffle(p.discard,g.rng);p.discard=[];log(g,`${who(i)} mélange sa défausse dans la pioche.`);}p.hand.push(p.deck.pop());drawn++;}return drawn;}
function startTurn(g){g.turn++;g.phase='prepare';g.pendingRepels=[];g.lastResult=null;for(let i=0;i<2;i++){
 const p=g.players[i];p.gained=0;p.techUsed=false;p.lastTechnique=null;p.primary=null;p.stance=null;p.pending=null;p.masked=new Set();
 if(p.hand.length>4){if(i===1){while(p.hand.length>4){const c=p.hand.splice(Math.floor(g.rng()*p.hand.length),1)[0];p.discard.push(c);}}else {g.phase='trim';}}
 if(i===1||p.hand.length<=4)draw(g,i,Math.max(0,4-p.hand.length));
 }log(g,`— TOUR ${g.turn} · Préparation —`);check(g);}
function trimHand(g,indices){if(g.phase!=='trim')throw Error('Pas de régulation en cours');const p=g.players[0];const excess=p.hand.length-4;if(indices.length!==excess||new Set(indices).size!==excess)throw Error(`Choisissez exactement ${excess} cartes à défausser.`);for(const idx of [...indices].sort((a,b)=>b-a)){const c=p.hand.splice(idx,1)[0];if(!c)throw Error('Index de main invalide');p.discard.push(c);}draw(g,0,Math.max(0,4-p.hand.length));g.phase='prepare';check(g);}
function useTech(g,i,name,option={}){
 const p=g.players[i];if(!p.techs.includes(name)||p.techUsed||p.insight<TECH_COST[name])return false;
 if((name==='Sondage'||name==='Recentrage')&&g.phase!=='prepare')return false;
 if(name==='Dissipation'&&g.phase!=='dissipation')return false;
 if((name==='Ancrage'||name==='Rupture')&&g.phase!=='tactics')return false;
 if(name==='Lecture'&&g.phase!=='lecture')return false;
 if(name==='Recentrage'&&!(option.handIndex>=0&&option.handIndex<p.hand.length))return false;
 if(name==='Dissipation'&&!g.players[1-i].masked.size)return false;
 if(name==='Ancrage'&&!(option.slot===0||option.slot===1))return false;
 if(name==='Rupture'&&!(option.slot===0||option.slot===1))return false;
 p.insight-=TECH_COST[name];p.techUsed=true;p.lastTechnique=name;log(g,`${who(i)} utilise ${name} (−${TECH_COST[name]} Insight).`);
 if(name==='Sondage'){const c=randomOf(g.players[1-i].hand,g.rng);log(g,c?`Sondage : ${cardText(c)}.`:'Sondage : main vide.',i);}
 if(name==='Recentrage'){const c=p.hand.splice(option.handIndex,1)[0];p.deck.unshift(c);draw(g,i,1);log(g,`Recentrage : une carte placée sous la pioche.`,i);}
 if(name==='Dissipation'){const op=g.players[1-i];op.masked.clear();log(g,'Dissipation neutralise le camouflage de préparation adverse.');}
 if(name==='Ancrage'||name==='Rupture')p.techPlan={name,slot:option.slot};
 return true;
}
function eligibleReveal(g,i){return g.players[i].secondary.map((s,idx)=>s&&!s.active&&s.placedTurn<g.turn?idx:null).filter(x=>x!==null);}

 if(visible.length&&g.rng()<0.35){const eligible=visible.filter(j=>op.masked.has(j)||p.secondary[slot].card.rank>=op.secondary[j].card.rank);if(eligible.length){mode='interfere';target=randomOf(eligible,g.rng);}}
 if(mode==='keep'&&g.rng()<0.70)mode=p.stance==='assault'?(g.rng()<0.55?'damage':'rank'):'rank';plans[slot]={mode,target};
 }
 let tech=null;if(!p.techUsed&&p.techs.includes('Ancrage')&&p.insight>=1&&g.rng()<0.15){const slot=plans.findIndex(x=>x&&x.mode!=='keep');if(slot>=0)tech={name:'Ancrage',slot};}
 if(!tech&&!p.techUsed&&p.techs.includes('Rupture')&&p.insight>=2&&p.stance==='guard'&&g.rng()<0.30){const slot=op.secondary.findIndex(s=>s?.active);if(slot>=0)tech={name:'Rupture',slot};}
 return {plans,tech};}
function check(g){for(const p of g.players){const all=[...p.deck,...p.hand,...p.discard,...p.secondary.filter(Boolean).map(s=>s.card),...(p.primary?[p.primary]:[])];if(all.length!==17)throw Error(`${p.name} : conservation des cartes rompue : ${all.length}/17`);const ids=new Set(all.map(x=>x.id));if(ids.size!==17)throw Error(`${p.name} : duplication de carte`);if(p.insight<0||p.insight>2||p.gained>1)throw Error('Insight hors limites');if(p.secondary.length!==2)throw Error('Nombre emplacements invalide');}return true;}
function publicLog(g,i=0){return g.log.filter(x=>x.privateTo===null||x.privateTo===i).slice(-95);}

let g=null,selectedPrimary=null,selectedSupport='',replaced='',stance='assault',revealSelection=new Set(),plans=[{mode:'keep'},{mode:'keep'}],heroTech='',heroTechSlot=0,lectureUsed=false,selectedTrim=new Set(),error='';
const $=s=>document.querySelector(s);const html=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function rune(f){return SYMBOL[f]||'✦'};
function labelCard(c){return `${c?.name||'—'}`;}
function card(c,opts={}){if(!c)return `<div class="slot empty">${opts.placeholder||'Emplacement libre'}</div>`;
 const mask=opts.mask||false; const back=opts.back||false;if(back)return `<div class="card back"><div class="backmark">✧</div><span>SECONDAIRE</span><small>Face cachée</small></div>`;
 const fam=c.family.toLowerCase(),sel=opts.selected?' chosen':'',sig=c.signature?' signature':'';
 return `<div class="card ${fam}${sel}${sig}" title="${html(EFFECT_TEXT[c.effect]||'Carte Basic')}" data-card-id="${c.id}"><div class="cardhead"><span class="cardrune">${rune(c.family)}</span><span class="cardrank">${mask?'?':c.signature?'∞':ROMAN[c.rank]}</span></div><div class="cardcenter"><div class="seal">${rune(c.family)}</div><div class="ornament"></div></div><div class="cardfooter"><strong>${mask?'Identité masquée':html(c.name)}</strong><div class="cardstats"><span>${html(c.rarity)}</span><b>⚔ ${mask?'?':c.power}</b></div>${c.effect&&!mask?`<small>${html(c.effect)}</small>`:'<small>Carte Basic</small>'}</div></div>`;
}
function boardSlot(p,i,owner){
 const s=p.secondary[i];if(!s)return `<div class="slotholder"><div class="slot empty">Emplacement ${i+1}<small>Secondaire</small></div></div>`;
 const enemy=owner===1, inactive=!s.active, charging=inactive&&s.placedTurn===g.turn, mask=enemy&&p.masked.has(i);
 const state=s.active?'active':charging?'charging':'reserve';
 const flag=s.active?'ACTIVE · PRÊTE':charging?'EN CHARGEMENT':'CACHÉE · INACTIVE';
 const desc=charging?'Inutilisable ce tour':inactive?'Révélez-la en préparation':'Disponible au Clash';
 // Pour son propriétaire, le nom est lisible mais la carte reste visuellement bloquée.
 // Pour le rival, une carte cachée n'affiche ni son identité ni ses valeurs.
 const overlay=!enemy&&inactive?`<div class="inactive-overlay" aria-label="${flag}, ${desc}"><span class="inactive-icon">◇</span><strong>${flag}</strong><small>${desc}</small><small>Face cachée pour le rival</small></div>`:'';
 return `<div class="slotholder ${state}"><div class="slotcard">${card(s.card,{back:enemy&&inactive,mask})}${overlay}</div><span class="slotflag ${state}">${flag}</span></div>`;
}
function bodyStructure(){const p=g.players[0],e=g.players[1];const names={trim:'Régulation de main',prepare:'Préparation',dissipation:'Préparation des effets',commit:'Engagement secret',lecture:'Lecture des postures',tactics:'Choix tactique',repel:'Conséquence de Clash',resolved:'Clash terminé',finished:'Victoire / défaite'};
 let cur=names[g.phase]||g.phase;
 $('#app').innerHTML=`<header class="top"><div class="brand"><span class="brandicon">✦</span><div><div class="kicker">SIMULATEUR TACTIQUE · V3.2 — TEST</div><h1>LES QUATRE VOIES</h1></div></div><div class="topright"><span class="chip">TOUR <b>${g.turn}</b></span><span class="chip">${cur}</span><button class="small" data-action="restart">Nouvelle partie</button><button class="small" data-action="export">Journal JSON</button></div></header><main class="layout"><section class="arena"><div class="arena-background"><div class="orb orb1"></div><div class="orb orb2"></div></div>
 <div class="fighter opponent"><div><div class="eyebrow">ADVERSAIRE</div><h2>Le rival</h2></div><div class="resources"><span class="pv">♥ ${e.hp} <small>/ ${e.maxHp} PV</small></span><span class="insight">◆ ${e.insight}/2</span><span class="deckcount">Pioche ${e.deck.length} · Main ${e.hand.length} · Défausse ${e.discard.length}</span></div></div>
 <div class="battleline opponentline"><div class="slots">${boardSlot(e,0,1)}${boardSlot(e,1,1)}</div><div class="prime">${e.primary&&g.phase!=='lecture'?card(e.primary):`<div class="slot primary-empty">PRIMAIRE RIVALE<div class="tiny">${g.phase==='commit'?'Engagement secret':'Non révélée'}</div></div>`}</div></div>
 <div class="field-mid"><div class="divider-left"></div><span>✧ CLASH ✧</span><div class="divider-left"></div></div>
 <div class="battleline hero-line"><div class="prime">${p.primary?card(p.primary):`<div class="slot primary-empty">VOTRE PRIMAIRE<div class="tiny">${g.phase==='commit'?'À choisir':'—'}</div></div>`}</div><div class="slots">${boardSlot(p,0,0)}${boardSlot(p,1,0)}</div></div>
 <div class="fighter hero"><div><div class="eyebrow">DUELLISTE</div><h2>Vous</h2></div><div class="resources"><span class="pv">♥ ${p.hp} <small>/ ${p.maxHp} PV</small></span><span class="insight">◆ ${p.insight}/2</span><span class="deckcount">Pioche ${p.deck.length} · Main ${p.hand.length} · Défausse ${p.discard.length}</span></div></div>
 <div class="handarea"><h3>Votre main <small>${p.hand.length} cartes</small></h3><div class="hand">${p.hand.map((c,i)=>`<div class="handitem">${card(c,{selected:g.phase==='commit'&&selectedPrimary===c.id})}<span class="handnum">${i+1}</span></div>`).join('')||'<p class="muted">Votre main est vide.</p>'}</div></div>
 </section><aside class="sidebar"><div class="stage"><div class="eyebrow">DÉCISION EN COURS</div><h2>${cur}</h2><div id="controls"></div></div><div class="journal"><div class="journal-title"><h3>Journal des actions</h3><button class="small" data-action="copy">Copier</button></div><div id="log"></div></div><div class="disclaimer">Graphismes CSS et Canvas générés par code · Aucun asset externe · Les choix adverses restent secrets jusqu'aux phases autorisées.</div></aside></main>`;
 $('#log').innerHTML=publicLog(g).slice(-24).reverse().map(x=>`<div class="logentry"><b>T${x.turn}</b><span>${html(x.msg)}${x.privateTo===0?'<em> [privé]</em>':''}</span></div>`).join('');
 const controls=$('#controls');controls.innerHTML=buildControls();window.scrollTo({top:0,behavior:'instant'});
}
function render(){try{if(!g){$('#app').innerHTML=setup();return;}bodyStructure();}catch(e){console.error(e);$('#app').innerHTML=`<div class="fatal"><h2>Erreur du simulateur</h2><pre>${html(e.stack||e.message)}</pre><button data-action="restart">Recommencer</button></div>`;}}
function setup(){return `<div class="setup"><div class="setup-panel"><div class="kicker">PROTOTYPE JOUABLE · SANS ASSETS</div><h1>LES QUATRE VOIES</h1><p>Simulateur de duel V3.2 (diagnostic détaillé du Clash et bonus Rang par affinité). Deux duellistes, 17 cartes chacun, Secondaires persistantes, Signatures ∞, variantes et Techniques Insight.</p><div class="setup-grid"><label>Votre Signature<select id="heroSig">${FAMILIES.map(f=>`<option value="${f}">${rune(f)} ${f}</option>`).join('')}</select></label><label>Signature du rival<select id="enemySig">${FAMILIES.map(f=>`<option value="${f}" ${f==='Ronce'?'selected':''}>${rune(f)} ${f}</option>`).join('')}</select></label><label>Vos PV<select id="heroHP">${[60,90,125,170,200].map(x=>`<option ${x===90?'selected':''}>${x}</option>`).join('')}</select></label><label>PV du rival<select id="enemyHP">${[60,90,125,170,200].map(x=>`<option ${x===90?'selected':''}>${x}</option>`).join('')}</select></label><label>Technique 1<select id="tech1">${Object.keys(TECH_COST).map(x=>`<option ${x==='Lecture'?'selected':''}>${x}</option>`).join('')}</select></label><label>Technique 2<select id="tech2">${Object.keys(TECH_COST).map(x=>`<option ${x==='Ancrage'?'selected':''}>${x}</option>`).join('')}</select></label><label>Numéro de graine<input id="seed" type="number" value="20261015"/></label><label>Catalogue<select id="catalog"><option value="variants">16 variantes V3.0</option><option value="basic">16 Basic</option></select></label></div><button class="primarybtn big" data-action="start">Commencer le duel →</button><p class="mini">La graine rend les tirages reproductibles. Le moteur n'utilise ni serveur distant ni modèle IA.</p></div><div class="setup-art"><div class="floating-runes">◆ ◈ ✿ ✦</div><div class="quote">Le Rang décide.<br/>La Puissance frappe.<br/>La maîtrise triomphe.</div></div></div>`;}
function optionButtons(vals,name,current){return `<div class="optrow">${vals.map(([v,title])=>`<button class="choice ${current===v?'active':''}" data-action="choice" data-name="${name}" data-value="${v}">${title}</button>`).join('')}</div>`;}
function nextButton(action,label){return `<button class="primarybtn" data-action="${action}">${label} <span>→</span></button>`;}
function buildControls(){const p=g.players[0],enemy=g.players[1],phase=g.phase;const err=error?`<div class="error">${html(error)}</div>`:'';const title=x=>`<div class="fieldlabel">${x}</div>`;
 if(phase==='trim'){const extra=p.hand.length-4;return `<p>Vous avez ${extra} carte(s) en trop après un Repoussement. Sélectionnez exactement ${extra} carte(s) à défausser.</p>${p.hand.map((c,i)=>`<label class="listopt"><input type="checkbox" data-name="trim" data-index="${i}" ${selectedTrim.has(i)?'checked':''}/> ${html(c.name)}</label>`).join('')}${err}${nextButton('trim','Valider la main')}`;}
 if(phase==='prepare'){
 const eligible=eligibleReveal(g,0);const early=Object.keys(TECH_COST).filter(t=>['Sondage','Recentrage'].includes(t)&&p.techs.includes(t)&&!p.techUsed&&p.insight>=TECH_COST[t]);return `<p><b>Attention :</b> les Secondaires sont cachées et inactives tant que vous ne les révélez pas volontairement. Celles posées ce tour-ci sont en chargement et ne peuvent pas être utilisées. Révélez les Secondaires chargées que vous souhaitez activer. Les nouvelles cartes posées ne pourront être utilisées qu'à un tour ultérieur.</p>
 ${title('Secondaires à révéler')}${eligible.length?eligible.map(i=>`<label class="listopt"><input type="checkbox" data-name="reveal" data-index="${i}" ${revealSelection.has(i)?'checked':''}/> Emplacement ${i+1} · ${html(p.secondary[i].card.name)}</label>`).join(''):'<p class="muted">Aucune Secondaire ancienne cachée prête.</p>'}
 ${title('Techniques de début de tour')}${early.length?early.map(t=>`<div class="techrow"><span><b>${t}</b> <small>−${TECH_COST[t]} ◆</small></span><button data-action="earlyTech" data-value="${t}">Utiliser</button></div>`).join(''):'<p class="muted">Pas de Technique disponible ici.</p>'}${err}${nextButton('prepare','Verrouiller la préparation')}`;}
 if(phase==='dissipation'){let possible=p.techs.includes('Dissipation')&&!p.techUsed&&p.insight>=1&&enemy.masked.size;return `<p>Les Secondaires nouvellement révélées sont actives. Une Technique peut dissiper un camouflage de préparation persistant.</p>${possible?`<label class="listopt"><input type="checkbox" id="dissipate"/> Dissipation · −1 ◆</label>`:'<p class="muted">Aucune Dissipation disponible ou cible valide.</p>'}${err}${nextButton('dissipate','Poursuivre vers l’engagement')}`;}
 if(phase==='commit'){const remaining=p.hand.filter(c=>c.id!==selectedPrimary&&!c.signature);return `<p>Choisissez secrètement <b>une Primaire obligatoire</b>, sa posture et, éventuellement, une nouvelle Secondaire.</p>${title('Primaire')}${p.hand.map(c=>`<button class="listopt ${selectedPrimary===c.id?'active':''}" data-action="selectPrimary" data-value="${c.id}">${rune(c.family)} ${html(c.name)} <span>⚔ ${c.power}</span></button>`).join('')}${title('Posture')}${optionButtons([['assault','Assaut ⚔'],['guard','Garde ◇']],'stance',stance)}${title('Nouvelle Secondaire, facultative')}<select id="support"><option value="">Aucune nouvelle pose</option>${remaining.map(c=>`<option value="${c.id}" ${selectedSupport===c.id?'selected':''}>${c.name}</option>`).join('')}</select>${p.secondary.every(Boolean)&&selectedSupport?`${title('Emplacement à remplacer')}<select id="replace"><option value="">Choisir une carte à défausser</option>${p.secondary.map((s,i)=>`<option value="${i}" ${String(replaced)===String(i)?'selected':''}>${i+1} · ${s.card.name}</option>`).join('')}</select>`:''}${err}${nextButton('commit','Verrouiller les engagements')}`;}
 if(phase==='lecture'){const can=p.techs.includes('Lecture')&&!p.techUsed&&p.insight>=2;const paid=p.lastTechnique==='Lecture';return `<p>Les Primaires sont engagées et encore cachées. Lecture coûte 2 Insight et révèle seulement le mode initial du rival.</p>${can?`<button class="listopt" data-action="payLecture">Activer Lecture maintenant · −2 ◆</button>`:''}${paid?`<p class="privateInfo">Mode adverse initial : <b>${enemy.stance==='assault'?'ASSAUT':'GARDE'}</b></p>${title('Votre posture finale')}${optionButtons([['assault','Assaut ⚔'],['guard','Garde ◇']],'stance',stance)}`:'<p class="muted">Vous pouvez conserver votre posture et passer à la révélation.</p>'}${err}${nextButton('lecture','Révéler les Primaires')}`;}
 if(phase==='tactics'){
 const active=p.secondary.map((s,i)=>s?.active?i:null).filter(x=>x!==null);const oppActive=enemy.secondary.map((s,i)=>s?.active?i:null).filter(x=>x!==null);let htmlstr=`<p>Les Primaires sont visibles. <b>Seules les Secondaires ACTIVE · PRÊTE sont utilisables.</b> Choisissez secrètement leurs actions maintenant ; le rival fait de même sans voir vos choix.</p>`;
 for(const slot of active){const s=p.secondary[slot],plan=plans[slot]||{mode:'keep'};htmlstr+=`<div class="tacticbox">${title(`${s.card.name} · emplacement ${slot+1}`)}<select data-name="tactic" data-slot="${slot}"><option value="keep" ${plan.mode==='keep'?'selected':''}>Conserver</option><option value="rank" ${plan.mode==='rank'?'selected':''}>Amplifier le Rang (+${rankCoeff(s.card,p.primary)}${s.card.family===p.primary.family?' · affinité +1':''})</option>${p.stance==='assault'?`<option value="damage" ${plan.mode==='damage'?'selected':''}>Amplifier les Dégâts (×${dmgCoeff(s.card,p.primary)})</option>`:''}<option value="interfere" ${plan.mode==='interfere'?'selected':''}>Interférer</option></select>`;
 if(plan.mode==='interfere')htmlstr+=`<select data-name="target" data-slot="${slot}"><option value="">Cible adverse...</option>${oppActive.filter(j=>enemy.masked.has(j)||s.card.rank>=enemy.secondary[j].card.rank).map(j=>`<option value="${j}" ${String(plan.target)===String(j)?'selected':''}>Case ${j+1} · ${enemy.masked.has(j)?'Identité masquée':enemy.secondary[j].card.name}</option>`).join('')}</select>`;htmlstr+='</div>';
 }
 if(!active.length)htmlstr+='<p class="muted">Aucune Secondaire active. Le Clash sera résolu sans soutien de votre côté.</p>';
 const possible=[];if(!p.techUsed){if(p.techs.includes('Ancrage')&&p.insight>=1&&active.some(slot=>plans[slot]?.mode!=='keep'))possible.push('Ancrage');if(p.techs.includes('Rupture')&&p.insight>=2&&p.stance==='guard'&&oppActive.length)possible.push('Rupture');}
 htmlstr+=`${title('Technique tactique (facultatif)')}<select id="tacticTech"><option value="">Aucune</option>${possible.map(t=>`<option ${heroTech===t?'selected':''} value="${t}">${t} · ${TECH_COST[t]} Insight</option>`).join('')}</select>`;
 if(heroTech&&possible.includes(heroTech)){let opts=heroTech==='Ancrage'?active.filter(i=>plans[i]?.mode!=='keep'):oppActive;htmlstr+=`<select id="techSlot">${opts.map(i=>`<option value="${i}" ${heroTechSlot===i?'selected':''}>${heroTech==='Ancrage'?'Votre carte':'Cible adverse'} · case ${i+1}</option>`).join('')}</select>`;}
 let damagePlan=active.filter(i=>plans[i]?.mode==='damage').map(i=>dmgCoeff(p.secondary[i].card,p.primary));const M=damagePlan.length?damagePlan.reduce((a,b)=>a+b,0):1;const score=p.primary.signature?'∞':p.primary.rank+active.filter(i=>plans[i]?.mode==='rank').reduce((a,i)=>a+rankCoeff(p.secondary[i].card,p.primary),0);
 htmlstr+=`<div class="preview">PRÉVISION PERSONNELLE · Score ${score} · M ×${M}<small>Résultat provisoire, avant Interférences ennemies.</small></div>${err}${nextButton('resolve','Révéler les tactiques et résoudre')}`;return htmlstr;
 }
 if(phase==='repel'){const push=g.pendingRepels.find(x=>x.owner===0);if(!push)return `<p>Le rival choisit les conséquences de son Clash.</p>${nextButton('refresh','Continuer')}`;return `<p><b>${push.kind}</b> : choisissez une Secondaire adverse admissible à repousser. Ce ciblage ne crée pas une nouvelle fenêtre de réaction.</p>${push.choices.filter(slot=>enemy.secondary[slot]).map(slot=>`<button class="listopt" data-action="repel" data-value="${slot}">Case ${slot+1} · ${enemy.secondary[slot].active?'Active':'Face cachée'}</button>`).join('')}<button class="choice" data-action="skip">Ne pas repousser</button>`;}
 if(phase==='resolved'||phase==='finished'){const r=g.lastResult;return `<div class="resultbox"><h3>${phase==='finished'?g.winner===0?'Victoire du duelliste':'Défaite du duelliste':r.summary}</h3><div class="resultrow"><span>Vos dégâts subis</span><b>${r.dmg[0]} PV</b></div><div class="resultrow"><span>Dégâts rivaux subis</span><b>${r.dmg[1]} PV</b></div><div class="resultrow"><span>Scores de Clash</span><b>${(r.publicScores?r.scores[0]+' / '+r.publicScores[1]:r.scores.join(' / '))}</b></div><div class="resultrow"><span>Multiplicateurs</span><b>×${r.mult[0]} / ×${r.mult[1]}</b></div></div>${phase==='finished'?nextButton('restart','Nouvelle partie'):nextButton('next','Tour suivant')}`;}
 return err;
}
function resetTurnUI(){selectedPrimary=null;selectedSupport='';replaced='';stance='assault';revealSelection=new Set();plans=[{mode:'keep'},{mode:'keep'}];heroTech='';heroTechSlot=0;lectureUsed=false;selectedTrim=new Set();error='';}
function safe(fn){try{error='';fn();render();}catch(e){error=e.message;console.error(e);render();}}
function doAction(action,element){if(action==='start')return safe(()=>{const techs=[$('#tech1').value,$('#tech2').value];if(new Set(techs).size!==2)throw Error('Choisissez deux Techniques distinctes');g=makeGame({heroSignature:$('#heroSig').value,enemySignature:$('#enemySig').value,heroHp:Number($('#heroHP').value),enemyHp:Number($('#enemyHP').value),techs,enemyTechs:['Ancrage','Dissipation'],seed:Number($('#seed').value),heroVariants:$('#catalog').value==='variants',enemyVariants:$('#catalog').value==='variants'});resetTurnUI();});
 if(action==='restart'){g=null;resetTurnUI();render();return;}
 if(action==='export')return safe(()=>{const content=JSON.stringify({seed:g.seed,turn:g.turn,phase:g.phase,log:publicLog(g),result:g.lastResult},null,2);const blob=new Blob([content],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`les-quatre-voies-${g.seed}-tour${g.turn}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
 if(action==='copy')return safe(()=>navigator.clipboard?.writeText(publicLog(g).map(x=>`T${x.turn}: ${x.msg}`).join('\n')));
 if(action==='choice'){if(element.dataset.name==='stance')stance=element.dataset.value;return render();}
 if(action==='selectPrimary'){selectedPrimary=element.dataset.value;selectedSupport='';return render();}
 if(action==='trim')return safe(()=>{trimHand(g,[...selectedTrim]);selectedTrim.clear();});
 if(action==='earlyTech')return safe(()=>{const name=element.dataset.value;const option=name==='Recentrage'?{handIndex:Math.max(0,g.players[0].hand.findIndex(c=>!c.signature))}:{};if(!useTech(g,0,name,option))throw Error('Technique indisponible');});
 if(action==='prepare')return safe(()=>{revealPreparation(g,[...revealSelection]);revealSelection.clear();});
 if(action==='dissipate')return safe(()=>finishDissipation(g,$('#dissipate')?.checked?0:null));
 if(action==='commit')return safe(()=>{if(!selectedPrimary)throw Error('Sélectionnez une Primaire.');commitHero(g,selectedPrimary,stance,selectedSupport||null,replaced===''?null:Number(replaced));});
 if(action==='payLecture')return safe(()=>{if(!useTech(g,0,'Lecture'))throw Error('Lecture impossible');lectureUsed=true;});
 if(action==='lecture')return safe(()=>{doLecture(g,lectureUsed,lectureUsed?stance:null);});
 if(action==='resolve')return safe(()=>{const heroPlans=plans.map(x=>x||{mode:'keep'});for(const plan of heroPlans)if(plan.mode==='interfere'&&plan.target===undefined)throw Error('Choisissez la cible de votre Interférence');const tech=heroTech?{name:heroTech,slot:heroTechSlot}:null;resolveTactics(g,heroPlans,tech);});
 if(action==='repel')return safe(()=>applyRepel(g,0,Number(element.dataset.value)));
 if(action==='skip')return safe(()=>skipRepel(g));
 if(action==='next')return safe(()=>{resetTurnUI();nextTurn(g);});
 if(action==='refresh')return render();
}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action)doAction(action.dataset.action,action);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.name==='reveal'){const idx=Number(t.dataset.index);t.checked?revealSelection.add(idx):revealSelection.delete(idx);}if(t.dataset.name==='trim'){const idx=Number(t.dataset.index);t.checked?selectedTrim.add(idx):selectedTrim.delete(idx);}if(t.id==='support'){selectedSupport=t.value;render();}if(t.id==='replace'){replaced=t.value;}if(t.dataset.name==='tactic'){const slot=Number(t.dataset.slot);plans[slot]={mode:t.value};heroTech='';render();}if(t.dataset.name==='target'){const slot=Number(t.dataset.slot);plans[slot].target=t.value===''?undefined:Number(t.value);render();}if(t.id==='tacticTech'){heroTech=t.value;heroTechSlot=0;render();}if(t.id==='techSlot')heroTechSlot=Number(t.value);});
function proceduralBackdrop(){const canvas=document.createElement('canvas');canvas.className='ambient-canvas';document.body.prepend(canvas);const ctx=canvas.getContext('2d');function draw(){const d=window.devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.scale(d,d);const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);let seed=110021;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};for(let i=0;i<110;i++){const x=rand()*w,y=rand()*h,r=rand()*1.5+.3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=`rgba(196,177,137,${rand()*.16})`;ctx.fill();}for(let i=0;i<12;i++){const x=rand()*w,y=rand()*h;ctx.strokeStyle='rgba(180,164,130,.06)';ctx.lineWidth=.6;ctx.beginPath();ctx.arc(x,y,12+rand()*70,0,Math.PI*2);ctx.stroke();}}window.addEventListener('resize',draw);draw();}
proceduralBackdrop();render();
